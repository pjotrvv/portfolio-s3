[project]
name = "profanity-api"
version = "0.1.0"
description = "An API for detecting profanity in text."
authors = [
    {name = "pjotrvv",email = "vanveenpjotr@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
transformers = "^4.40.0"
torch = "^2.3.0"
sqlmodel = "^0.0.20"
psycopg2-binary = "^2.9.9"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
